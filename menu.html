<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Knight Bite</title>
    <link rel="icon" href="./images/kb_footer.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <img class="logo" src="./images/kb_logo_new_2.png" alt="logo">
            <ul class="nav-links">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./franchise.html">Franchise</a></li>
            </ul>
        </nav>
        <div class="content">
            <div class="menu">
                <div class="menu-item" data-category="0">
                    <img src="./menu-images/burger-icon.png">
                    <h1>Burgers</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
                <div class="menu-item" data-category="1">
                    <img src="./menu-images/starters-icon.png">
                    <h1>Fries/Starters</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
                <div class="menu-item" data-category="2">
                    <img src="./menu-images/main-course-icon.png">
                    <h1>Main Course</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
                <div class="menu-item" data-category="3">
                    <img src="./menu-images/drinks-icon.png">
                    <h1>Drinks</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
                <div class="menu-item" data-category="4">
                    <img src="./menu-images/wrap-icon.png">
                    <h1>Wraps</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
                <div class="menu-item" data-category="5">
                    <img src="./menu-images/desserts-icon.png">
                    <h1>Desserts</h1>
                    <img src="./menu-images/add-icon.svg">
                </div>
            </div>
        </div>
        <div class="category-details">
            <button class="close-button"></button>
            <div class="category-img"></div>
            <div class="category-items-list">
                <h1 class="main-header" id="div-header"> </h1>
                <div class="category-container"></div>
            </div>
        </div>
        <div class="copyright-menu">
            <p>
                "Ⓒ Copyright "
                <span class="year">2025</span>
                ". Knight Bite Pvt. Ltd. All Rights Reserved"
            </p>
        </div>
        <div class="mask" onclick="closeDialog()"></div>
    </div>
    
</body>
</html>
